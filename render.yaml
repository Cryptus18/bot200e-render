
services:
  - type: worker
    name: bot-200e-auto-capital
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: CAPITAL
        value: 200
      - key: RISK_EUROS
        value: 2.0
      - key: DAILY_STOP
        value: -6.0
      - key: POSITION_USD
        value: 10
      - key: AUTO_EXECUTE
        value: true
      - key: CAPITAL_IS_DEMO
        value: true
